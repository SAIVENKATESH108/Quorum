<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="quorumGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#14141F" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#quorumGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Consensus Nexus Orbit -->
  <circle cx="32" cy="32" r="22" stroke="url(#quorumGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Central Interlocking Quorum Diamond -->
  <polygon points="32,12 50,32 32,52 14,32" stroke="url(#quorumGrad)" stroke-width="2.5" fill="none" />

  <!-- Multi-Agent Node Swarms -->
  <circle cx="32" cy="12" r="3.5" fill="#7c3aed" filter="url(#glow)" />
  <circle cx="50" cy="32" r="3.5" fill="#6366f1" filter="url(#glow)" />
  <circle cx="32" cy="52" r="3.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="14" cy="32" r="3.5" fill="#a855f7" filter="url(#glow)" />

  <!-- Central Orchestrator Core -->
  <circle cx="32" cy="32" r="6" fill="url(#coreGrad)" />
  <circle cx="32" cy="32" r="10" stroke="#7c3aed" stroke-width="1.5" opacity="0.8" />
</svg>
