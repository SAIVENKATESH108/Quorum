name: Quorum CI/CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gate:
    name: Web Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./apps/web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Zmx1ZW50LXBvcnBvaXNlLTYyLmNsZXJrLmFjY291bnRzLmRldiQ"
          CLERK_SECRET_KEY: "sk_test_mock_ci_secret_key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"

  api-quality-gate:
    name: Backend API Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quorum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quorum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup UV Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Ruff Lint Checks
        run: uv run ruff check .

      - name: Run Pytest Suite
        run: uv run pytest tests/ -v
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/quorum_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "mock_test_key"
          ANTHROPIC_API_KEY: "mock_test_key"
